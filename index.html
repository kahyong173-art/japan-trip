* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

// OpenStreetMap 地点搜索（Nominatim，免费，需用户主动触发）
let lastGeocode = 0;
async function geocode(q, near) {
  const wait = 1100 - (Date.now() - lastGeocode); if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastGeocode = Date.now();
  const p = new URLSearchParams({ format: 'jsonv2', q, countrycodes: 'jp', limit: '10', addressdetails: '0', 'accept-language': 'zh-CN,ja,en' });
  if (near && hasXY(near)) { const d = 0.25; p.set('viewbox', `${near.lng - d},${near.lat + d},${near.lng + d},${near.lat - d}`); }
  const data = await fetchJSON('https://nominatim.openstreetmap.org/search?' + p.toString());
  return (data || []).map(r => ({ name: r.name || String(r.display_name || '').split(',')[0], address: r.display_name, lat: +r.lat, lng: +r.lon, type: r.type, category: r.category }));
}
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
async function overpass(q) {
  let lastErr;
  for (const url of OVERPASS) {
    try { return await fetchJSON(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }, 30000); }
    catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('无法连接');
}
function cleanLine(name) { return String(name || '').split(/[:：]/)[0].replace(/\s*[（(][^）)]*[）)]\s*/g, '').replace(/\s+→.*$/, '').trim(); }
function normName(s) { return String(s || '').toLowerCase().normalize('NFKC').replace(/[\s・·.,，。、\-_'"“”‘’()（）【】\[\]「」]/g, ''); }
// 附近车站：OpenStreetMap 数据。距离为直线距离。
async function findStations(c, radius = 1000) {
  const q = `[out:json][timeout:25];
nwr(around:${radius},${c.lat},${c.lng})[railway~"^(station|halt)$"];
out center;
node(around:${radius + 400},${c.lat},${c.lng})[public_transport=stop_position][~"^(train|subway|light_rail|monorail)$"~"^yes$"]->.sp;
foreach.sp->.s(
  .s out;
  rel(bn.s)[type=route][route~"^(train|subway|light_rail|monorail|tram)$"];
  out tags;
);`;
  const data = await overpass(q);
  const stations = []; const stops = []; let cur = null;
  for (const el of data.elements || []) {
    const t = el.tags || {};
    if (el.type === 'relation') { if (cur) cur.routes.push(t); continue; }
    if (t.public_transport === 'stop_position') { cur = { lat: el.lat, lng: el.lon, name: t.name || '', routes: [] }; stops.push(cur); continue; }
    if (t.railway === 'station' || t.railway === 'halt') {
      const lat = el.lat ?? (el.center && el.center.lat), lng = el.lon ?? (el.center && el.center.lon);
      if (!Number.isFinite(lat)) continue;
      const zh = t['name:zh-Hans'] || t['name:zh-CN'] || t['name:zh'] || '';
      stations.push({ lat, lng, name: t['name:ja'] || t.name || t['name:en'] || '（未命名车站）', zh, en: t['name:en'] || '', operator: t.operator || t.network || '',
        kind: t.station === 'subway' ? '地铁' : (t.station === 'light_rail' || t.station === 'monorail' ? '轻轨/单轨' : '铁路'), lines: new Map(), d: distM(c, { lat, lng }) });
    }
  }
  // 合并重复（同名同运营商且很近）
  const uniq = [];
  for (const s of stations.sort((a, b) => a.d - b.d)) {
    if (uniq.some(u => u.name === s.name && u.operator === s.operator && distM(u, s) < 200)) continue;
    uniq.push(s);
  }
  // 把停车位置上的线路归到车站
  for (const sp of stops) {
    if (!sp.routes.length) continue;
    let best = null, bestScore = Infinity;
    for (const s of uniq) {
      const d = distM(s, sp); if (d > 500) continue;
      const nameHit = sp.name && (sp.name.includes(s.name) || s.name.includes(sp.name.replace(/駅$/, '')));
      const score = nameHit ? d : d + 600;
      if (score < bestScore && (nameHit || d < 250)) { best = s; bestScore = score; }
    }
    if (!best) continue;
    for (const r of sp.routes) {
      const ln = cleanLine(r['name:ja'] || r.name || r.ref); if (!ln) continue;
      if (!best.lines.has(ln)) best.lines.set(ln, { name: ln, colour: r.colour || '' });
    }
  }
  return uniq.slice(0, 10).map(s => Object.assign(s, { lines: Array.from(s.lines.values()) }));
}

/* ---------- 汇率与账目计算 ---------- */
function counts(e) {
  if (e.kind === 'exchange') return false;
  if (e.kind === 'ictopup') return db.settings.icMode === 'topup';
  if (e.payment === '交通卡' && db.settings.icMode === 'topup') return false;
  return true;
}
function whyNotCounted(e) {
  if (e.kind === 'exchange') return '换汇是资金转换，不算消费';
  if (e.kind === 'ictopup') return '充值不计入，乘车扣款时再计入';
  if (e.payment === '交通卡' && db.settings.icMode === 'topup') return '已在充值时计入，不重复计算';
  return '';
}
const expCat = e => e.kind === 'ictopup' ? '交通' : (e.category || '其他');
function toJPY(e) { if (e.currency === 'JPY') return e.amount; if (e.actualMYR != null && e.rate) return e.amount * e.rate; return e.rate ? e.amount * e.rate : null; }
function toMYR(e) { if (e.actualMYR != null) return e.actualMYR; if (e.currency === 'MYR') return e.amount; return e.rate ? e.amount / e.rate : null; }
const yen = v => v == null ? '—' : '¥' + Math.round(v).toLocaleString('en-US');
const rm = v => v == null ? '—' : 'RM ' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtOrig = e => e.currency === 'JPY' ? yen(e.amount) : rm(e.amount);
function inTrip(e) {
  const d = (e.datetime || '').slice(0, 10), s = db.settings;
  if (s.tripStart && d < s.tripStart) return false;
  if (s.tripEnd && d > s.tripEnd) return false;
  return true;
}
function sumUp(list) {
  let jpy = 0, myr = 0, missing = 0, n = 0; const byCat = {};
  for (const e of list) {
    if (!counts(e)) continue;
    n++;
    const j = toJPY(e), m = toMYR(e);
    if (j != null) jpy += j; else missing++;
    if (m != null) myr += m; else missing++;
    const c = expCat(e); byCat[c] = byCat[c] || { jpy: 0, myr: 0 };
    if (j != null) byCat[c].jpy += j; if (m != null) byCat[c].myr += m;
  }
  return { jpy, myr, missing, n, byCat };
}

function makeMap(el, center, zoom, noteEl) {

function favMatches(p) {
  const nq = normName(ui.favQuery);
  if (nq && !normName([p.name, p.city, p.address, p.note].join(' ')).includes(nq)) return false;
  if (ui.favCat !== '全部' && p.category !== ui.favCat) return false;
  if (ui.favPri !== 'all' && p.priority !== ui.favPri) return false;
  if (ui.favStatus === 'visited' && !p.visited) return false;
  if (ui.favStatus === 'unvisited' && p.visited) return false;
  if (ui.favTab === 'pending' && hasXY(p)) return false;
  return true;
}

      $('#ba-next', s.body).onclick = () => {

        if (!lines.length) { toast('请先粘贴地点名称'); return; }
        const seen = new Set();
        rows = lines.map(name => {

    } else {
      const k = rows.filter(r => r.keep).length;
      s.set(`<div class="note">共 ${rows.length} 行，将添加 ${k} 个到「待确认」。标为重复的默认不添加，你可以勾选改变。</div>
        <div class="stack">${rows.map((r, i) => `<label class="prow" style="cursor:pointer"><input type="checkbox" data-i="${i}" ${r.keep ? 'checked' : ''} style="width:22px;height:22px"><div class="grow"><div class="t">${esc(r.name)}</div>${r.dup ? `<div class="s" style="color:var(--warn)">重复提醒：${r.dup}</div>` : ''}</div></label>`).join('')}</div>
        <div class="btns"><button class="btn" id="ba-back">返回修改</button><button class="btn primary" id="ba-ok">添加 ${k} 个</button></div>`);
      $$('[data-i]', s.body).forEach(c => c.onchange = () => { rows[+c.dataset.i].keep = c.checked; draw(); });
      $('#ba-back', s.body).onclick = () => { rows = null; draw(); };
      $('#ba-ok', s.body).onclick = () => {
        const now = Date.now();
        rows.filter(r => r.keep).forEach((r, i) => db.places.unshift({ id: uid(), name: r.name, category: cat, city, address: '', lat: null, lng: null, mapUrl: '', note: '', priority: 'want', visited: false, hours: '', cost: null, stayMin: null, createdAt: now - i, updatedAt: now }));
        save(); s.close(); ui.favTab = 'pending'; toast(`已添加 ${k} 个，请逐个确认位置`); setPage('favs');
      };
    }
  }
}

/* CSV */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
const csvCell = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCSV = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
const CSV_COLS = { name: ['名称', 'name', '店名', '地点'], category: ['分类', 'category', '类别'], city: ['城市', '地区', 'city'], address: ['地址', 'address'],
  lat: ['纬度', 'lat', 'latitude'], lng: ['经度', 'lng', 'lon', 'longitude'], mapUrl: ['地图链接', '链接', 'url', 'link'], note: ['备注', 'note', 'notes'],
  priority: ['优先级', 'priority'], visited: ['状态', 'status'], hours: ['营业时间', 'hours'], cost: ['人均', '人均消费', 'cost'], plan: ['计划日期', 'plan', 'date'] };
function parsePlanDate(v) {
  v = String(v || '').trim(); let m = v.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = v.match(/^(\d{1,2})[/月.](\d{1,2})日?$/);
  if (m) return `${jstToday().slice(0, 4)}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  return '';
}
function csvImport() {
  const s = openSheet('导入 CSV 名单', `<p class="muted small" style="margin:0">第一行写栏目名称。可用的栏目：名称、分类、城市、地址、纬度、经度、地图链接、备注、优先级、状态、营业时间、人均、计划日期。只有「名称」是必填。有坐标或可识别地图链接的会直接加入，其余放进「待确认」。</p>

    <label class="btn primary big" style="position:relative">选择 CSV 文件<input type="file" id="csv-file" accept=".csv,text/csv,text/plain" style="position:absolute;inset:0;opacity:0"></label>
    <div id="csv-out"></div>`, api => {
    $('#csv-tpl', api.body).onclick = () => saveFile('收藏地点模板.csv', toCSV([Object.values(CSV_COLS).map(a => a[0]), ['浅草寺', '景点', '东京', '東京都台東区浅草2-3-1', '35.7148', '139.7967', '', '早上去人少', '必去', '未去', '', '', '2026-11-30']]), 'text/csv');
    $('#csv-file', api.body).onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      let rows; try { rows = parseCSV(await readFileText(file)); } catch (err) { $('#csv-out', api.body).innerHTML = '<div class="note warn">文件读取失败。</div>'; return; }
      if (!rows.length) { $('#csv-out', api.body).innerHTML = '<div class="note warn">文件是空的。</div>'; return; }
      const head = rows[0].map(h => String(h).trim().toLowerCase());
      const idx = {}; for (const [k, names] of Object.entries(CSV_COLS)) idx[k] = head.findIndex(h => names.some(n => n.toLowerCase() === h));

        <div class="scroll-x"><table class="preview"><tr><th>名称</th><th>分类</th><th>位置</th><th>提醒</th></tr>${items.slice(0, 50).map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.category)}</td><td>${i.lat != null ? '有' : '<span style="color:var(--warn)">待确认</span>'}</td><td style="color:var(--warn)">${esc(i._dup)}</td></tr>`).join('')}</table></div>

    rows.push([e.datetime.replace('T', ' '), KINDS[e.kind], expCat(e), e.amount, e.currency, e.rate ?? '', j != null ? Math.round(j) : '', m != null ? m.toFixed(2) : '', e.actualMYR ?? '', counts(e) ? '是' : '否', whyNotCounted(e), e.payment, e.merchant, pl, e.note, e.sample ? '是' : '']);
  });
  saveFile(`旅行账本-${jstToday()}.csv`, toCSV(rows), 'text/csv');
}

// 合并：只加入现有资料里没有的项目（按 id 判断），不会覆盖或删除
function mergeIncoming(incoming) {
  const pid = new Set(db.places.map(p => p.id)), eid = new Set(db.expenses.map(e => e.id));
  let a = 0, b = 0;
  incoming.places.forEach(p => { if (!pid.has(p.id)) { db.places.push(p); a++; } });
  incoming.expenses.forEach(e => { if (!eid.has(e.id)) { db.expenses.push(e); b++; } });
  const st = db.settings, ist = incoming.settings;
  if (!st.rate && ist.rate) { st.rate = ist.rate; st.rateSource = ist.rateSource; st.rateTime = ist.rateTime; }
  if (!st.tripStart && !st.tripEnd && (ist.tripStart || ist.tripEnd)) { st.tripStart = ist.tripStart; st.tripEnd = ist.tripEnd; }
  incoming.starts.forEach(s => { if (!db.starts.some(x => x.name === s.name && distM(x, s) < 30)) db.starts.push(s); });
  save();
  return { a, b };
}
// 导入链接：资料压缩后放在网址 # 后面。# 后面的内容不会发送到服务器，也不在代码仓库里。
async function importFromHash() {
  const h = location.hash || '';
  if (!h.startsWith('#import=')) return;
  const clearHash = () => { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* 忽略 */ } };
  let incoming;
  try {
    const b64 = h.slice(8).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    const j = JSON.parse(text); if (j.app !== 'jp-trip-helper' || !j.data) throw new Error('bad');
    incoming = normalizeDB(j.data);
  } catch (e) {
    clearHash();
    openSheet('导入链接无法读取', '<div class="note warn">这个导入链接不完整或已损坏。请确认复制了完整的链接，或改用「数据与设置 → 从备份文件恢复」。</div>');
    return;
  }
  const newP = incoming.places.filter(p => !db.places.some(x => x.id === p.id)).length;
  const newE = incoming.expenses.filter(e => !db.expenses.some(x => x.id === e.id)).length;
  openSheet('导入行程', `<div class="note">这个链接里有 <b>${incoming.places.length}</b> 个地点和 <b>${incoming.expenses.length}</b> 笔账。</div>
    ${newP || newE ? `<p style="margin:0">将加入 <b>${newP}</b> 个新地点、<b>${newE}</b> 笔新账。你现有的资料不会被删除或覆盖。</p>
      <button class="btn primary big" id="hi-ok">导入</button>` : '<div class="note ok">这些资料之前已经导入过了，不需要再导入。</div>'}
    <button class="btn block" id="hi-no">${newP || newE ? '暂时不要' : '关闭'}</button>`, api => {
    const ok = $('#hi-ok', api.body);
    if (ok) ok.onclick = () => { const r = mergeIncoming(incoming); api.close(); ui.favTab = 'plan'; setPage('favs'); toast(`已导入：${r.a} 个地点、${r.b} 笔账`); };
    $('#hi-no', api.body).onclick = () => api.close();
  });
  clearHash();
}
function addStart(loc) {
  openSheet('存为常用起点', `<label class="f">名称<input class="input" id="as-name" value="${esc(loc.name || '')}" placeholder="例如 新宿的酒店"></label><button class="btn primary big" id="as-ok">保存</button>`, api => {
    $('#as-ok', api.body).onclick = () => {

      render(); toast('已存为常用起点');

  });
}

/* ---------- 路由与渲染 ---------- */
const TITLES = { nearby: '附近', go: '去哪里', favs: '我的收藏', ledger: '旅行账本' };
function setPage(p) { ui.page = p; try { localStorage.setItem(KEY + '.tab', p); } catch (e) { /* 忽略 */ } window.scrollTo(0, 0); render(); }
function renderIf(p) { if (ui.page === p) render(); }
function render() {
  if (nearMap && ui.page !== 'nearby') { nearMap.remove(); nearMap = null; }
  $('#title').textContent = TITLES[ui.page];

  ({ nearby: renderNearby, go: renderGo, favs: renderFavs, ledger: renderLedger })[ui.page]();
  renderBanner();
}
